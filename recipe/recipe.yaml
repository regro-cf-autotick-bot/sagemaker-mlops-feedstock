schema_version: 1

context:
  version: "1.28.0"

package:
  name: sagemaker-mlops
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sagemaker-mlops/sagemaker_mlops-${{ version }}.tar.gz
  sha256: dfca5c2d45f49745d9daa51c0237dda7199300bf05d6efde47902fa407ee3b8b

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    rm -f $SP_DIR/sagemaker/__init__.py
    rm -rf $SP_DIR/sagemaker/__pycache__

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - sagemaker-core >=2.24.0
    - sagemaker-train >=1.24.0
    - sagemaker-serve >=1.24.0
    - boto3 >=1.42.2,<2.0
    - botocore >=1.42.2,<2.0
    - pyiceberg >=0.8.0
    - pyarrow >=14.0.0
    - s3fs
  # protobuf arrives transitively via sagemaker-train/sagemaker-serve -> mlflow ->
  # databricks-sdk, which forbids protobuf 5.26-5.28.* and 5.29.0-4. Without this the
  # solver backtracks to protobuf 5.28.3 and `pip check` fails. Soft-constrain protobuf
  # to the databricks-sdk-compatible window.
  run_constraints:
    - protobuf >=5.29.5,<7

tests:
  - script:
      # sagemaker.mlops's import chain reaches AIRHub (via sagemaker-train), which
      # builds boto3 clients at class-definition (import) time, so a region must be
      # set or the import raises NoRegionError. Upstream fix tracked in
      # aws/sagemaker-python-sdk PR #6401; remove this once a release includes it.
      env:
        AWS_DEFAULT_REGION: us-east-1
      content:
        - python -c "import sagemaker.mlops"
        - pip check
    requirements:
      run:
        - pip
about:
  summary: SageMaker MLOps package for workflow orchestration and model building
  homepage: https://github.com/aws/sagemaker-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://sagemaker.readthedocs.io/en/stable/
  repository: https://github.com/aws/sagemaker-python-sdk

extra:
  recipe-maintainers:
    - mollyheamazon
    - mufaddal-rohawala
    - nargokul
    - aviruthen
